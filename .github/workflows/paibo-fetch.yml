# 四站待播池重采 —— 腾讯 / 优酷 / 芒果 / 爱奇艺 的「即将上线」
#
# 前置（一次性，都在 GitHub 网页上设）：
#   1. Settings → Actions → General → Workflow permissions → Read and write
#   2. 本文件放 .github/workflows/ 下；fetch_paibo.mjs / paibo.json / index.html
#      三个都放仓库根（paibo.json 可以先不传，脚本第一次跑自己建）
#   3. （11-02 起没有第三步了）以前这里要建一个 IQY_DID 的 secret 给爱奇艺档期那一路用，
#      那一路整个死了、换成了匿名口，所以那个 secret 现在用不上，可以删掉。
#
# 取数没有 cookie、没有签名、没有浏览器，一个 step 一分钟内跑完，所以「装 Playwright」那一步整个没有。
# 这份文件不读任何仓库 secret（GITHUB_TOKEN 除外，那是推提交用的）。
#
# ⚠ 这份文件是"读旧-追加-写新"的：days[]（哪天定档、哪天进池、哪天被撤）只存在
#   paibo.json 这一个文件里，四个平台都只有"当前这一屏"、没有历史接口。
#   所以提交前一定要先 pull --rebase；撞车（底本过期）时这一轮的提交直接作废，
#   改成按远端那一版重新采一次再推 —— 因为底本旧了算出来的 diff 本身就是错的。
#   代价是撞车那一拍多采一轮（固定 120 个、铺满浮动时最多 168 个）；正常节拍不撞车就一次都不多花。
#   绝不 force：宁可这一轮白跑，也不能把攒了几天的定档记录覆盖掉 —— 那个补不回来。
#
# 节拍不在这里，在 Worker 的 Settings → Triggers 页上（cron 是 UTC）。
# ⚠ 那一条的分钟位要写成**一个具体数字**（`30 0,4,8,12 * * *`），不要写成「每半小时」那种带星号的：
#   Worker 靠这个分别认得「定点的那几拍」和另外两条全天/窗口的闹钟。数字本身随便挑，
#   改分钟、加小时位都不用动 Worker 的代码，也不用重新部署 —— 判据只认「分钟位是不是纯数字」。
#   敲不敲的判据是看板顶部那行「最后一次更新」有没有在往前走。
# 一天四拍：00:30 / 04:30 / 08:30 / 12:30 UTC = 北京 08:30 / 12:30 / 16:30 / 20:30。
#   一轮 120 个固定请求、一天 480 个（11-02 从两拍抬到四拍，是他说要抬的）。
# 那 120 个是：腾讯 4 + 腾讯即将上线筛选页 4 + 优酷 9 + 芒果首页 2 + 芒果新片日历 2
#   + 爱奇艺 A 路 3 + 爱奇艺预约数 2 + 爱奇艺档期 92。
# ⚠ 大头是爱奇艺档期那 92 个：那个口按片名搜、没有批量口，一条一个请求，数目跟着池子走
#   （池子哪天涨到一百二，它就跟着涨到一百二）。按 4 个一批发，实测整池 16 秒、连打 12 发零异常。
#   想省它只有一条路：找到 App「新片预告」那一屏的列表口（一发给一整月的档期）。
#   11-02 摸过网页端，只有逐条搜索这一种形状（片库那个列表口 videolib/data 已经死了，见下面）。
# 腾讯那 4 个是 1 张频道页 + 最多 3 屏 getCard：它一屏只给 36 条，翻页不吃页码、
#   只吃它自己回的那个游标（flip_infos.change），36 + 36 + 28 才算到底 = 整池 100 条。
#   ⚠ 以前这里记的是「腾讯 2、整池 36 条」——那是只敲了一屏就以为到底了，池子小了一倍还多。
# 另外那 4 个是 App 端「电视剧 → 筛选 → 即将上线」那张列表（getMVLPage，10-26 接上）：
#   12 + 40 + 40 + 32 = 124 条，翻页同样只吃它自己回的那一格 page_context。
#   ⚠ 这一路结构上没有预约数、没有集数、没有档期，只给「预约破300万」那种档位文字；
#     它值钱的地方是比卡片那一路多 26 条（短剧、二轮剧，含《北境往事》），
#     那 26 条逐条敲详情页 21 条填了集数 —— 卡片那 100 条只有 8 条填。
#   ⚠ 它地址栏那个 vversion_platform=3 / 抓包带的一整串 cookie 都不需要：不带任何票、
#     用现有那套匿名头（origin/referer 不能少，少了回 ret=20607 一条不给）就回数据。
# ⚠ 另有一笔浮动的：三家都有「逐条才拿得到」的数 —— 优酷和腾讯的集数在每部片子自己的详情页（一条一个请求），
#   芒果的预约数、集数、类型在每部片子自己的移动端页（一条两个请求：445 字节的壳 → 真页）。
#   每家每拍最多补 12 条（只在「这一条还没问过」时才敲门，四扇一批并发）⇒ 浮动上限 12 + 12 + 12×2 = 48，
#   所以一轮最多 120 + 48 = 168 个、一天最多 672 个（四拍）。
#   铺满一遍：腾讯 126 条约 11 拍、优酷 144 条约 12 拍、芒果 51 条约 5 拍 —— 一天四拍之后
#   是三天铺满（两拍那阵要六天），之后每拍只碰新进来的那几条，浮动那一笔自己会落下去。
#   ⚠ 芒果这一版多排一项（类型）：这一拍之前已经填满预约数和集数的那 21 条，光按「缺数」排队就再也不进门，
#     类型永远认不到、电影永远留在单子里（10-26 沙箱实跑抓到的）。所以排队条件加了「类型还没认过」，
#     认出来的类型存在档案里、下一拍接回来用，认一条少一条 ⇒ 门数一个不多（仍旧每拍 12 扇），
#     只是上传后的头五拍它要把这 51 条重新走一遍门；这期间页面上还会看见电影和动漫，是还没敲到那一扇门，不是漏了。
#   ⚠ 芒果这一家只收「电视剧」（他 10-26 点的：池子里混着电影和动漫）。认的是那一页 <title> 末段
#     芒果自己标的这一档（电视剧 / 电影 / 动漫少儿…），不是我按片名猜的；尾巴有两种形状，
#     电视剧是「-全集高清视频-芒果TV」、电影和动漫是「-最新高清视频在线观看-芒果TV」，两种都认。
#     认不出形状的留成「未标」—— 照样在单子里，只是不再占门（不许当「不是电视剧」剔掉）。
#     剔掉的那几条记进档案里的备忘（mgOff），意义是「我们自己不收」，不是「平台撤了」：
#     diff 报出池时先跳过这份备忘，否则上传后第一拍就会印出一条「芒果今天撤了 8 部」的假新闻。
#     备忘每拍自己瘦身（片单里已经没有的那条跟着掉出去），取数失败那一拍不清空。
#   ⚠ 也试过更省的路：拿新片日历那一发的 pbid 当分类（pbid 10 那 6 条里认得出的 3 条全是电影）—— 没用它，
#     因为芒果没说 10 就是电影档，那是我从六条样本里猜的；要的是它自己写在页上的那一档。
#   ⚠ 腾讯那 12 扇不按站内次序从第 1 条铺：筛选页独有的那 26 条提到队首（他 10-26 点的），
#     前三拍就把那 21 个集数拿到手 ⇒ 页面上靠后的那几条先有数。整池那 126 条仍旧十一拍铺完（门数一个不多），
#     代价只有卡片那一屏自己从第九拍推到第十一拍。
#     每一拍到底敲了哪几条、其中几扇给了筛选页，都写在采集注记里。
#   爱奇艺的集数本来就在 A 路里，一个请求都不多花。
# 优酷那 9 个是「即将上线」那张片单一页 20 条、八页翻完（实测 144 条），头一页要先空签一发换一枚临时票所以多一个；
# 片单那一路没接上时还会再多一发去接首页那一屏，接上了就是 9。
# 芒果日历那 2 个是 pbid 8 和 9 两发（实测 32 条 + 47 条，和首页那 10 条去重之后 51 条）。
# ⚠ 它地址栏里那串 did/mac/oaid/seqId 实测不校验 —— 换成每次现编的随机值照样回同一份单子，
#   所以这一路不用建任何 secret、也不用加环境变量。但它给不了预约数、给不了集数，
#   32 条里只有 1 条填了档期；那两个数仍旧只能逐条敲门（旧版这里写的是「池子只有十条、封顶 20 个」——
#   10-26 接上日历之后池子 51 条，改成每拍 12 扇按站内次序铺）。
# 爱奇艺预约数那 2 个是批量口（一发带 60 个 albumId），和档期那一路通不通无关。
# 爱奇艺档期那 92 个（11-02 换的这一路）：GET mesh.if.iqiyi.com/portal/lw/search/homePageV3?key=<片名>
#   全匿名 —— 不带 device_id、不带 token、不带 cookie；UA / referer 给不给、换成 App 的 UA 都回同一份，
#   本机出口和 Cloudflare 出口都通。认回话里 channel=电视剧,2 且 qipuId===albumId 那一条
#   （按 ID 硬对上，不是按片名猜）：releaseTime.value 排上档期给 '2026-11-05'、没排上只给一个年份
#   '2026'（占位，不算档期），startUpdateTime 跟着从 '即将上线' 变成 '本周四18:00上线'
#   —— 92 条里那两格无一例外地同进同退。11-02 拿线上那 92 条整池实跑：92/92 对上、当场 5 条带档期
#   （档案里当时是 0 条）、16 秒跑完、零失败。
#   ⚠ 少回一大截就不算这一路回了话：对上的不足 30 条就按「这一拍没问到」走，上一轮的档期原样保住 ——
#     拿一张残缺的搜索结果去覆盖整池，diff 里就成了「爱奇艺今天把 5 部的档期撤了」。
#   ⚠ 上一代那一发是片库列表口 videolib/data（要一枚 device_id 当环境变量 + 仓库 secret）：
#     它回 HTTP 200、301 字节、code:0，整份回话里根本没有片单那个键（只有 dataExtRisk.risk_level:2
#     加一枚它自己那套 H5 运行时才签得出的 token）。空 device_id、现场编的、他那枚真的、去掉 referer、
#     换手机 UA、换版本串 —— 六组回的是逐字节一样的字节 ⇒ 挡人的不是凭据；
#     10-25 记的「分钟级窗口」11-02 也证伪了（90 秒一发连敲 8 发全空壳，19:57:47→20:08:18），
#     而它自 10-27 起线上 0 次回话 ⇒ 整段摘掉，那个 IQY_DID 现在用不上，可以删了。
#   这一栏本来就近乎是空的：11-02 同一拍腾讯 0/138、优酷 0/144、芒果 3/47、爱奇艺 5/92。
#   待播池的档期是临近开播才挂上页的，所以档期那一路断了的代价只在「某部刚挂档期正好撞上」那一条，
#   晚一拍出现、不会丢。页面那一行为什么报时刻：旧那句挂在「沿用了几部」上，池子空的时候它压根不印，
#   看着像一切正常；时刻这一格是每拍都写得出来的事实。
# 定档公告基本都在白天出，所以 11-02 从一天两拍抬到四拍（08:30 / 12:30 / 16:30 / 20:30）——
# 他要的是「公告到上板之间那段最长等待」从 12 小时压到 4 小时。半小时一拍仍然不做：
# 那只会把同一个 id 在同一格里重复写四遍（脚本会去重），换来的只是档案里多几个只动了时间戳的版本。
#
# ⚠ 下面的 schedule 是备份，主力闹钟是 Worker 的 Cron Trigger。
#   线上 42 次 run 逐条数过（11-02 拿 API 抄的表）：Worker 那几发（事件名 workflow_dispatch）
#   天天准点落在 :30；这一条备份（事件名 schedule）**每一发都迟 5–6.5 小时才起跑**，
#   00:33 UTC 那档实测落在北京 13:12–14:44、12:33 UTC 那档落在凌晨 01:20–02:50，八天八发全这样。
#   ⇒ 他看到的「下午两点多为什么会跑一次」就是这一发，不是多跑，是备份闹钟迟到的正常长相。
#   ⚠ 11-02 抬到四拍的时候这一条**故意没跟着抬**（仍旧两档）：它既然恒迟五六小时，
#     四档就会落在北京 14:33 / 18:33 / 22:33 / 02:33 —— 正好插进四拍中间，
#     一天变成 8 次写档案、960 个固定请求（爱奇艺那个搜索口一天 736 发），那是他没要的账。
#     它管的是「Worker 那条闹钟死了看板还更不更新」，两档就够回答；真挂了，第二天凌晨那发就把 at 推上去了。
#   备份故意错开分钟（:33，主闹钟是 :30），免得和主闹钟同一分钟撞进同一个 concurrency 组、
#   被 cancel-in-progress 自己掐掉。
# 注意：YAML 的注释只能以 # 开头，写成 /* */ 会让整个文件解析失败、GitHub 直接不认这个 workflow。

name: paibo-four-stations-01

on:
  schedule:
    - cron: '33 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paibo-four-stations-01
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 这一格是「一发挂住不回话时最多能拖多久」的上限，不是预计要跑这么久：
    # 脚本每个请求自己带 25 秒超时。11-02 换了档期那一路之后，最长那条链变成爱奇艺 ——
    # 那个口按片名搜、没有批量口，池子 92 条就是 92 发，4 个一批 ⇒ 23 批，全踩满 575 秒 ≈ 9.6 分钟；
    # 加上另外三家各自的链（优酷「空签一发 + 八页片单」九发串行 ≈ 3.7 分钟），最坏要过 13 分钟。
    # 所以这一格从 10 抬到 15 —— 抬它不是为了跑更久，是为了「慢但跑得完」别被误判成「跑不完」。
    # 本机 11-02 实测整拍 20.5 秒（92 发只占其中十六秒）；10-26 那两拍是二分五十秒和三秒。
    # 正常的耗时账是这个量级，15 分钟纯是保险。跑不完就被掐掉，掐掉不推，不会写坏 json。
    # 撞车那一拍会在同一个 15 分钟里再采一遍（正常两分钟一轮，跑得完）；跑不完就被掐掉，
    # 那一轮不推 —— 宁缺不盖，被掐掉不会写坏 json。
    timeout-minutes: 15
    env:
      PAIBO_OUT: paibo.json
      PAIBO_KEEP: '60'
    steps:
      - uses: actions/checkout@v4
        with:
          # 默认只拉 1 层，rebase 撞车时不够用；这个仓库就几个文件，全量便宜。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 默认就是正式跑，上传完什么都不用改，手动 Run 一次即可。
      # 只有一种情况要动这一行：正式跑挂了、要分清是"机房 IP 被四家拒"还是"脚本本身有问题"，
      # 就把 run 改成 `PAIBO_PROBE=1 node fetch_paibo.mjs` —— 探测模式取数、打印、
      # 但不写文件也不提交。四行平台各自的条数会一行行打出来，哪一家是 0 一眼就看到。
      # 新接的两条链通没通，看日志里那两行就够：
      #   芒果「预约数拿到 49 条」+「类型认出 51 条」= 移动端那个壳和真页都拿到了；
      #     前一个数印 0 就是被拒或 SSR 改了，后一个数印 0 而「芒果页上没写类型的」一整池都是，就是标题那两档尾巴变了形状
      #   爱奇艺「D 路对上 92/92 条，其中带真档期 5（…）」= 档期这一路活着
      #     印「只对上 N 条、比平时少太多，这一轮当没问到」就是这一路抖了：池子和上一轮的档期都保住，
      #     页面顶部多一行「爱奇艺档期这一路最后一次回话 · 时刻」。连着好几拍都这样才回去敲那个口。
      - name: 抓取
        run: node fetch_paibo.mjs

      - name: 提交结果
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f "$PAIBO_OUT" ] || { echo "::notice::没有产出文件，跳过提交（探测模式或抓取失败）"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PAIBO_OUT"
          # 每一轮 at 都会动，所以这一道判断平时不会命中；留着是为了防脚本哪天写回同一个文件。
          git diff --cached --quiet && { echo "字节完全没变，不提交"; exit 0; }
          git commit -m "待播池 $(TZ=Asia/Shanghai date '+%F %H:%M')"
          # 定档史全在这个 json 里，覆盖掉就永远补不回来，所以绝不 force。
          #
          # ⚠ 2026-10-25 21:26 那一拍的日志：Auto-merging paibo.json / CONFLICT (content)，
          #   同一句念了四遍，最后红叉。原因是两拍叠上了 —— 上一拍还没推完，下一拍的 checkout
          #   拿的已经是旧底本，而 paibo.json 是整份重写的单行 JSON，rebase 必然撞这一行。
          #   旧那版「退避重试四次」一次都没救回来过：底本没换，重 pull 还是同一个冲突。
          #   真修法是换底本重算 —— 这个脚本是「读旧 → diff → 写新」，底本旧了 diff 就是错的，
          #   硬推会把上一拍攒的定档记录盖掉，所以拿远端那一版重来一遍。
          if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
            echo "推上去了"; exit 0
          fi
          git rebase --abort 2>/dev/null || true
          # 等几秒是给上一拍留推完的时间，不然重 fetch 到的还是同一份旧底本。
          sleep $((RANDOM % 8 + 5))
          echo "::notice::底本过期（撞车），这一轮作废、按远端那一版重采一次"
          git fetch origin "$GITHUB_REF_NAME"
          # 只丢这一拍自己那个提交；工作区是临时 runner，跑完就没了。
          git reset --hard "origin/$GITHUB_REF_NAME"
          node fetch_paibo.mjs
          git add "$PAIBO_OUT"
          if git diff --cached --quiet; then
            echo "远端那一版已经含这一轮的内容了，不重复提交"; exit 0
          fi
          git commit -m "待播池 $(TZ=Asia/Shanghai date '+%F %H:%M')（撞车后重采）"
          if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
            echo "重采一次推上去了"; exit 0
          fi
          git rebase --abort 2>/dev/null || true
          echo "::error::连着两拍都在撞车，重采一次也没推上去，这一轮不推（红叉留到真出事的时候才看）"
          exit 1
