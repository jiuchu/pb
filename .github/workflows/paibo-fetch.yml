# 四站待播池重采 —— 腾讯 / 优酷 / 芒果 / 爱奇艺 的「即将上线」
#
# 前置（一次性，都在 GitHub 网页上设）：
#   1. Settings → Actions → General → Workflow permissions → Read and write
#   2. 本文件放 .github/workflows/ 下；fetch_paibo.mjs / paibo.json / index.html
#      三个都放仓库根（paibo.json 可以先不传，脚本第一次跑自己建）
#   3. Settings → Secrets and variables → Actions → New repository secret，
#      名字就叫 IQY_DID，值是那一串 31 位小写字母数字的爱奇艺设备标识。
#      ⚠ 这一条只影响爱奇艺那一格的「定档日」。不建这个 secret 也能跑：
#      爱奇艺照常回整池（九十多条）、照常带精确预约人数，只是这一格里一个日期都没有 ——
#      日志里会印一行「B 路跳过」，不是报错。
#
# 取数没有 cookie、没有签名、没有浏览器，一个 step 三十秒内跑完，所以「装 Playwright」那一步整个没有。
# 唯一那一个 secret 不是账号凭证，就是一台浏览器的编号，掉了不影响另外三家。
#
# ⚠ 这份文件是"读旧-追加-写新"的：days[]（哪天定档、哪天进池、哪天被撤）只存在
#   paibo.json 这一个文件里，四个平台都只有"当前这一屏"、没有历史接口。
#   所以提交前一定要先 pull --rebase；撞车（底本过期）时这一轮的提交直接作废，
#   改成按远端那一版重新采一次再推 —— 因为底本旧了算出来的 diff 本身就是错的。
#   代价是撞车那一拍多花一轮（固定 28 个——爱奇艺 B 路被挡回空壳的那一拍是 29 个、铺满浮动时最多 77 个）；正常节拍不撞车就一次都不多花。
#   绝不 force：宁可这一轮白跑，也不能把攒了几天的定档记录覆盖掉 —— 那个补不回来。
#
# 节拍不在这里，在 Worker 的 Settings → Triggers 页上（cron 是 UTC）。
# ⚠ 那一条的分钟位要写成**一个具体数字**（`30 0,12 * * *`），不要写成「每半小时」那种带星号的：
#   Worker 靠这个分别认得「定点的两拍」和另外两条全天/窗口的闹钟。数字本身随便挑，改分钟不用动代码。
#   敲不敲的判据是看板顶部那行「最后一次采集」有没有在往前走。
# 一天两拍：00:30 / 12:30 UTC = 北京 08:30 / 20:30，一轮 28 个固定请求、一天 56 个。
# 那 28 个是：腾讯 4 + 腾讯即将上线筛选页 4 + 优酷 9 + 芒果首页 2 + 芒果新片日历 2 + 爱奇艺 A 路 3 + 爱奇艺 B 路 2 + 爱奇艺预约数 2。
# ⚠ 爱奇艺 B 路那一发被挡回空壳时只多 1 个（重敲头一页一次）⇒ 那一拍 29 个、58 个/天；没挡着就还是 28 个。
# 腾讯那 4 个是 1 张频道页 + 最多 3 屏 getCard：它一屏只给 36 条，翻页不吃页码、
#   只吃它自己回的那个游标（flip_infos.change），36 + 36 + 28 才算到底 = 整池 100 条。
#   ⚠ 以前这里记的是「腾讯 2、整池 36 条」——那是只敲了一屏就以为到底了，池子小了一倍还多。
# 另外那 4 个是 App 端「电视剧 → 筛选 → 即将上线」那张列表（getMVLPage，10-26 接上）：
#   12 + 40 + 40 + 32 = 124 条，翻页同样只吃它自己回的那一格 page_context。
#   ⚠ 这一路结构上没有预约数、没有集数、没有档期，只给「预约破300万」那种档位文字；
#     它值钱的地方是比卡片那一路多 26 条（短剧、二轮剧，含《北境往事》），
#     那 26 条逐条敲详情页 21 条填了集数 —— 卡片那 100 条只有 8 条填。
#   ⚠ 它地址栏那个 vversion_platform=3 / 抓包带的一整串 cookie 都不需要：不带任何票、
#     用现有那套匿名头（origin/referer 不能少，少了回 ret=20607 一条不给）就回数据。
# ⚠ 另有一笔浮动的：三家都有「逐条才拿得到」的数 —— 优酷和腾讯的集数在每部片子自己的详情页（一条一个请求），
#   芒果的预约数、集数、类型在每部片子自己的移动端页（一条两个请求：445 字节的壳 → 真页）。
#   每家每拍最多补 12 条（只在「这一条还没问过」时才敲门，四扇一批并发）⇒ 浮动上限 12 + 12 + 12×2 = 48，
#   所以一轮最多 28 + 48 = 76 个、一天最多 152 个（爱奇艺 B 路被挡回空壳那一拍各 +1）。
#   铺满一遍：腾讯 126 条约 11 拍、优酷 144 条约 12 拍、芒果 51 条约 5 拍，
#   之后每拍只碰新进来的那几条，浮动那一笔自己会落下去。
#   ⚠ 芒果这一版多排一项（类型）：这一拍之前已经填满预约数和集数的那 21 条，光按「缺数」排队就再也不进门，
#     类型永远认不到、电影永远留在单子里（10-26 沙箱实跑抓到的）。所以排队条件加了「类型还没认过」，
#     认出来的类型存在档案里、下一拍接回来用，认一条少一条 ⇒ 门数一个不多（仍旧每拍 12 扇），
#     只是上传后的头五拍它要把这 51 条重新走一遍门；这期间页面上还会看见电影和动漫，是还没敲到那一扇门，不是漏了。
#   ⚠ 芒果这一家只收「电视剧」（他 10-26 点的：池子里混着电影和动漫）。认的是那一页 <title> 末段
#     芒果自己标的这一档（电视剧 / 电影 / 动漫少儿…），不是我按片名猜的；尾巴有两种形状，
#     电视剧是「-全集高清视频-芒果TV」、电影和动漫是「-最新高清视频在线观看-芒果TV」，两种都认。
#     认不出形状的留成「未标」—— 照样在单子里，只是不再占门（不许当「不是电视剧」剔掉）。
#     剔掉的那几条记进档案里的备忘（mgOff），意义是「我们自己不收」，不是「平台撤了」：
#     diff 报出池时先跳过这份备忘，否则上传后第一拍就会印出一条「芒果今天撤了 8 部」的假新闻。
#     备忘每拍自己瘦身（片单里已经没有的那条跟着掉出去），取数失败那一拍不清空。
#   ⚠ 也试过更省的路：拿新片日历那一发的 pbid 当分类（pbid 10 那 6 条里认得出的 3 条全是电影）—— 没用它，
#     因为芒果没说 10 就是电影档，那是我从六条样本里猜的；要的是它自己写在页上的那一档。
#   ⚠ 腾讯那 12 扇不按站内次序从第 1 条铺：筛选页独有的那 26 条提到队首（他 10-26 点的），
#     前三拍就把那 21 个集数拿到手 ⇒ 页面上靠后的那几条先有数。整池那 126 条仍旧十一拍铺完（门数一个不多），
#     代价只有卡片那一屏自己从第九拍推到第十一拍。
#     每一拍到底敲了哪几条、其中几扇给了筛选页，都写在采集注记里。
#   爱奇艺的集数本来就在 A 路里，一个请求都不多花。
# 优酷那 9 个是「即将上线」那张片单一页 20 条、八页翻完（实测 144 条），头一页要先空签一发换一枚临时票所以多一个；
# 片单那一路没接上时还会再多一发去接首页那一屏，接上了就是 9。
# 芒果日历那 2 个是 pbid 8 和 9 两发（实测 32 条 + 47 条，和首页那 10 条去重之后 51 条）。
# ⚠ 它地址栏里那串 did/mac/oaid/seqId 实测不校验 —— 换成每次现编的随机值照样回同一份单子，
#   所以这一路不用建任何 secret、也不用加环境变量。但它给不了预约数、给不了集数，
#   32 条里只有 1 条填了档期；那两个数仍旧只能逐条敲门（旧版这里写的是「池子只有十条、封顶 20 个」——
#   10-26 接上日历之后池子 51 条，改成每拍 12 扇按站内次序铺）。
# 爱奇艺预约数那 2 个是批量口（一发带 60 个 albumId），和 device_id 无关：B 路断了它照样给数。
# ⚠ 爱奇艺 B 路这一发「有时候问不到开播日期」不是链路坏了：它回的是 HTTP 200、301 字节、code:0，
#   整份回话里根本没有片单那个键（只有 dataExtRisk.risk_level:2 和一枚校验用的 token）。
#   同一个 device_id 换个分钟就给了（10-25 21:18 空壳、21:26 对上 39/94 条），机房 IP 也照样挡
#   （10-26 20:30 那一拍印的就是「没回话」）；device_id、referer、UA 三样都逐一换着实测，回话逐字节一样，
#   所以嫌疑人只剩「时间窗」这一个。这一版按他点的第②种做法：拿到空壳就隔 2.5~4 秒重敲头一页一次，
#   重敲那一发不带上一轮的游标（当新的一发问）；还不给就按「这一拍没问到」走，
#   片子和上一轮的档期原样保住，页面顶部只印一行「爱奇艺本次没有获取排播日期」。
#   ⚠ 这一发不保证：重试撞的还是同一个窗口，明天该挡还是挡。它是把「碰巧开着的那几分钟」抓回来的杠杆，不是护栏。
# 定档公告基本都在白天出，一天两拍足够把它抓住；半小时一拍只会把同一个 id 在同一格里
# 重复写四遍（脚本会去重），换来的只是档案里多几个只动了时间戳的版本。
#
# ⚠ 下面的 schedule 是备份，主力闹钟是 Worker 的 Cron Trigger ——
#   GitHub 的定时事件从他这个账号整个停了（2026-10-18 canary 已判完）。
#   备份故意错开分钟（:33，主闹钟是 :30），免得和主闹钟同一分钟撞进同一个 concurrency 组、
#   被 cancel-in-progress 自己掐掉。
# 注意：YAML 的注释只能以 # 开头，写成 /* */ 会让整个文件解析失败、GitHub 直接不认这个 workflow。

name: paibo-four-stations-01

on:
  schedule:
    - cron: '33 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paibo-four-stations-01
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 10 分钟不是预计要跑这么久，是让「七十发里有一发挂住不回话」那一发拖不死整格：
    # 脚本每个请求自己带 25 秒超时，四家各跑各的链、逐条那一门四扇一批并发，
    # 最长那条链是优酷「空签一发 + 八页片单 + 三批集数」十来发，全踩满约五分钟，还在上限之内。
    # 本机 10-26 实测两拍：慢的那拍二分五十秒（绝大部分是爱奇艺档期那一发没回话、在等它的 25 秒超时），
    # 快的那拍三秒。跑不完就被掐掉，掐掉不推，不会写坏 json。
    # 撞车那一拍会在同一个 10 分钟里再采一遍（正常两分钟一轮，跑得完）；跑不完就被掐掉，
    # 那一轮不推 —— 宁缺不盖，被掐掉不会写坏 json。
    timeout-minutes: 10
    env:
      PAIBO_OUT: paibo.json
      PAIBO_KEEP: '60'
      # 没建这个 secret 也照跑：脚本自己跳过爱奇艺 B 路，日志印一行「B 路跳过」，
      # 爱奇艺仍回整池、仍带预约人数（那走的是另一条批量口），另外三家一点不受影响。
      PAIBO_IQY_DID: ${{ secrets.IQY_DID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 默认只拉 1 层，rebase 撞车时不够用；这个仓库就几个文件，全量便宜。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 默认就是正式跑，上传完什么都不用改，手动 Run 一次即可。
      # 只有一种情况要动这一行：正式跑挂了、要分清是"机房 IP 被四家拒"还是"脚本本身有问题"，
      # 就把 run 改成 `PAIBO_PROBE=1 node fetch_paibo.mjs` —— 探测模式取数、打印、
      # 但不写文件也不提交。四行平台各自的条数会一行行打出来，哪一家是 0 一眼就看到。
      # 新接的两条链通没通，看日志里那两行就够：
      #   芒果「预约数拿到 49 条」+「类型认出 51 条」= 移动端那个壳和真页都拿到了；
      #     前一个数印 0 就是被拒或 SSR 改了，后一个数印 0 而「芒果页上没写类型的」一整池都是，就是标题那两档尾巴变了形状
      #   爱奇艺「B 路对上 39/94 条」  = device_id 这一发通了
      #   那两行现在都有线上实测了：芒果「预约数拿到 49 条」；爱奇艺 21:18 那拍印「B 路没回话」、
      #   21:26 那拍印「对上 39/94」⇒ 单次「没回话」当抖动看（这一版会自己隔几秒重敲一次），
      #   连着好几拍都空才回去怀疑 id 或参数集 —— 那两样 10-26 已经逐条证伪过一轮了。
      - name: 抓取
        run: node fetch_paibo.mjs

      - name: 提交结果
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f "$PAIBO_OUT" ] || { echo "::notice::没有产出文件，跳过提交（探测模式或抓取失败）"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PAIBO_OUT"
          # 每一轮 at 都会动，所以这一道判断平时不会命中；留着是为了防脚本哪天写回同一个文件。
          git diff --cached --quiet && { echo "字节完全没变，不提交"; exit 0; }
          git commit -m "待播池 $(TZ=Asia/Shanghai date '+%F %H:%M')"
          # 定档史全在这个 json 里，覆盖掉就永远补不回来，所以绝不 force。
          #
          # ⚠ 2026-10-25 21:26 那一拍的日志：Auto-merging paibo.json / CONFLICT (content)，
          #   同一句念了四遍，最后红叉。原因是两拍叠上了 —— 上一拍还没推完，下一拍的 checkout
          #   拿的已经是旧底本，而 paibo.json 是整份重写的单行 JSON，rebase 必然撞这一行。
          #   旧那版「退避重试四次」一次都没救回来过：底本没换，重 pull 还是同一个冲突。
          #   真修法是换底本重算 —— 这个脚本是「读旧 → diff → 写新」，底本旧了 diff 就是错的，
          #   硬推会把上一拍攒的定档记录盖掉，所以拿远端那一版重来一遍。
          if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
            echo "推上去了"; exit 0
          fi
          git rebase --abort 2>/dev/null || true
          # 等几秒是给上一拍留推完的时间，不然重 fetch 到的还是同一份旧底本。
          sleep $((RANDOM % 8 + 5))
          echo "::notice::底本过期（撞车），这一轮作废、按远端那一版重采一次"
          git fetch origin "$GITHUB_REF_NAME"
          # 只丢这一拍自己那个提交；工作区是临时 runner，跑完就没了。
          git reset --hard "origin/$GITHUB_REF_NAME"
          node fetch_paibo.mjs
          git add "$PAIBO_OUT"
          if git diff --cached --quiet; then
            echo "远端那一版已经含这一轮的内容了，不重复提交"; exit 0
          fi
          git commit -m "待播池 $(TZ=Asia/Shanghai date '+%F %H:%M')（撞车后重采）"
          if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
            echo "重采一次推上去了"; exit 0
          fi
          git rebase --abort 2>/dev/null || true
          echo "::error::连着两拍都在撞车，重采一次也没推上去，这一轮不推（红叉留到真出事的时候才看）"
          exit 1
